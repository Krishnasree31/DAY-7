
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Google Fonts Example</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 30px;
            text-align: center;
        }

        h1 {
            font-size: 36px;
            font-weight: 700;
            font-style: normal;
            color: darkblue;
        }

        h2 {
            font-size: 28px;
            font-weight: 600;
            font-style: italic;
            color: darkgreen;
        }

        p {
            font-size: 18px;
            font-weight: 400;
            font-style: normal;
            color: #333;
            line-height: 1.8;
        }

        .special {
            font-size: 20px;
            font-weight: 300;
            font-style: italic;
            color: purple;
        }
    </style>
</head>

<body>

    <h1>Welcome to My Webpage</h1>

    <h2>About Me</h2>

    <p>
        Hello! I am a B.Tech graduate and an aspiring software developer.
        I am interested in learning HTML, CSS, Python and JavaScript.
    </p>

    <p class="special">
        I enjoy learning new technologies and developing creative websites.
    </p>

</body>
</html>
