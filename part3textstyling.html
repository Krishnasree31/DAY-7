
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Text Styling Example</title>


    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 36px;
            color: darkblue;
            text-shadow: 3px 3px 5px gray;
        }

        h2 {
            text-align: left;
            text-transform: capitalize;
            letter-spacing: 2px;
            color: darkgreen;
        }

        p {
            text-align: justify;
            text-transform: none;
            letter-spacing: 1px;
            font-size: 17px;
            line-height: 1.8;
            color: #333;
        }

        .special {
            text-align: center;
            text-transform: capitalize;
            letter-spacing: 2px;
            color: purple;
        }
    </style>
</head>

<body>

    <h1>Welcome to My Webpage</h1>

    <h2>About Me</h2>

    <p>
        Hello! I am a B.Tech graduate and an aspiring software developer.
        I am interested in learning HTML, CSS, Python and JavaScript.
        I enjoy learning new technologies and developing creative websites.
    </p>

    <p class="special">
        Learning New Skills Builds A Better Future!
    </p>

</body>
</html>
